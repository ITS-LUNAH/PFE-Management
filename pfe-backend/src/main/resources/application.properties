spring.application.name=pfe-backend

spring.datasource.url=jdbc:mysql://localhost:3306/pfe_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
# ici l'utilisation de create-drope est juste pour le développement et le test, et pour ne pas perdre les données à chaque redémarrage on peut le changer à update ou validate pour la production
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8